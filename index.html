.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin:16px 0}.field label{font:700 13px "Trebuchet MS","Segoe UI",sans-serif;display:block;margin-bottom:7px}input,select,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;background:white;font:15px "Trebuchet MS","Segoe UI",sans-serif;color:var(--brown)}textarea{min-height:110px;resize:vertical}

.metricgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.metric{background:var(--soft);border-radius:16px;padding:18px}.metric span{display:block;font:12px "Trebuchet MS","Segoe UI",sans-serif;text-transform:uppercase;letter-spacing:1px}.metric strong{display:block;font:28px Georgia;margin-top:7px}
.pill{display:inline-block;padding:6px 10px;border-radius:99px;background:#eadbc9;font:700 11px "Trebuchet MS","Segoe UI",sans-serif;margin:3px}.section{border-top:1px solid var(--line);padding-top:22px;margin-top:22px}

<div class="app" id="app"><div style="text-align:center;font:700 10px Arial;color:#80685a;letter-spacing:2px;margin:4px 0 10px">MONEY RESET · PRIVATE BETA · TEST BUILD</div><div class="card" id="screen"></div></div>
<script>
let SAVED=null;
try{SAVED=JSON.parse(localStorage.getItem('moneyResetBeta')||'null')}catch(e){SAVED=null;try{localStorage.removeItem('moneyResetBeta')}catch(_){}}
const MAX_BETA_STEP=14;
const S={
 step:0,goals:[],incomeFreq:"",incomeAmount:"",nextPay:"",accounts:[],
 bills:[],nonMonthly:[],spending:[],debts:[],debtPref:"",
 savings:[],reserve:"",upcoming:[],stress:"",anything:"",incomeNotes:"",approved:false,transfers:[]
};

if(SAVED && SAVED.version===1 && SAVED.data){
  const restored=normalizeImportedRecord(SAVED.data);
  Object.keys(restored).forEach(k=>{S[k]=restored[k]});
}

const steps=[
{e:"PERSONALIZED HOUSEHOLD MONEY PLANNING",t:"The Money Reset",intro:true},
{e:"LET'S START WITH YOU",t:"Your Goals",q:"What would you most like Money Reset to help you with?",multi:"goals",opts:["Stop running out of money","Get organized","Pay off debt","Build savings","Prepare for a big purchase","Plan a trip/event","Something else"]},
{e:"INCOME",t:"Your Income",q:"How often do you receive income?",income:true,opts:["Weekly","Every 2 weeks","Twice a month","Monthly","Irregular","Multiple income sources","Something else"]},
{e:"ACCOUNTS",t:"Your Accounts",q:"Which accounts or money locations do you use?",multi:"accounts",opts:["Checking","Savings","Cash","Credit card","Multiple checking/savings","Other account","I'm not sure"]},
{e:"BILLS",t:"Your Regular Bills",list:"bills",prompt:"Add your regular bills. Use one bill per line.",ph:"Rent | 1400 | monthly | 1\nCar | 300 | monthly | 15\nPhone | 200 | monthly | 20",help:"Format: Name | Amount | Frequency | Due day. You can also enter a simple description; anything unclear stays an assumption until confirmed."},
{e:"NON-MONTHLY EXPENSES",t:"Expenses That Don't Happen Every Month",list:"nonMonthly",prompt:"Add less-frequent expenses. Use one expense per line.",ph:"Car registration | 180 | yearly\nSchool supplies | 250 | yearly\nBirthday | 150 | as needed",help:"Money Reset preserves the frequency you enter. It does not automatically turn everything into a weekly budget."},
{e:"EVERYDAY SPENDING",t:"Your Real-Life Spending",list:"spending",prompt:"Add everyday/variable spending. Use one category per line.",ph:"Groceries | 150 | weekly\nGas | 70 | every 2 weeks\nEating out | 120 | monthly",help:"Describe what you actually do. The plan should fit real life, not force your spending into an artificial schedule."},
{e:"DEBT",t:"Your Debt",list:"debts",debt:true,prompt:"Debt is optional. Add one debt per line.",ph:"Visa | 2400 | 75 | monthly | 18 | 24.99\nAuto loan | 12000 | 300 | monthly | 15 | 8.5",help:"Format: Creditor | Balance | Minimum | Frequency | Due day | Interest rate. Unknown details can stay blank."},
{e:"SAVINGS & GOALS",t:"Savings and Goals",list:"savings",prompt:"Add savings goals. Use one goal per line.",ph:"Emergency fund | 3000 | 2026-12-31 | 900\nVacation | 2000 | 2027-04-01 | 500",help:"Format: Goal | Target | Desired date | Already saved. You can say 'none', 'nothing saved', or 'I don't have any savings' when the amount already saved is $0."},
{e:"RESERVE",t:"Emergency & Backup Money",area:"reserve",prompt:"Tell us about money you intentionally keep available as a reserve or emergency cushion.",ph:"Example: $1,500 kept available for unexpected household repairs or emergencies.",},
{e:"UPCOMING",t:"What's Coming Up?",area:"upcoming",prompt:"List upcoming expenses or events Money Reset should account for.",ph:"Example: annual insurance payment in November; family trip in April; school registration next month."},
{e:"REAL LIFE",t:"The Part Numbers Don't Explain",area:"stress",prompt:"What's the biggest money stress or problem you want this plan to solve?",ph:"Be honest. This helps Money Reset prioritize the plan around your actual life."},
{e:"ANYTHING ELSE",t:"Anything Else We Should Know?",area:"anything",prompt:"Tell us anything that could change how your money plan should work.",ph:"Timing issues, household needs, priorities, irregular income, concerns, or anything else."},
{e:"REVIEW",t:"Let's Make Sure We Got It Right",review:true},
{e:"PLAN",t:"Your Money Reset",plan:true}
];

function esc(x){return String(x??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function money(n){return Number.isFinite(n)?n.toLocaleString(undefined,{style:"currency",currency:"USD",maximumFractionDigits:0}):"—"}
function parseMoney(value,options={}){
 const original=String(value??"").trim();
 if(original==="") return 0;
 if(options.allowNaturalZero){
   const naturalZero=/^(?:none|nothing|zero|no savings?|no money|i (?:do not|don't|dont) have (?:any )?(?:savings?|money)|i (?:have|got) (?:no|nothing) (?:saved|in savings?)|nothing saved|not saved|no amount|n\/?a)$/i;
   if(naturalZero.test(original)) return 0;
 }
 const raw=original.replace(/[$,\s]/g,"");
 const n=Number(raw);
 return Number.isFinite(n)?n:NaN;
}
function parseSavedAmount(value){return parseMoney(value,{allowNaturalZero:true})}
function parseReserveAmount(value){return parseMoney(value,{allowNaturalZero:true})}
function setListNone(kind){const el=document.getElementById("area");if(!el)return;el.value="none";S[kind]=[];invalidateApproval();}
function naturalNoItems(value){
 const v=String(value??"").trim();
 return /^(?:none|nothing|no(?:\s+(?:debt|debts|bills?|regular bills?|expenses?|spending|savings?|goals?|accounts?))?|i(?:\s+do)?n?['’]?t\s+have(?:\s+any)?\s+(?:debt|debts|bills?|regular bills?|expenses?|spending|savings?|goals?|accounts?)|i\s+have\s+no\s+(?:debt|debts|bills?|regular bills?|expenses?|spending|savings?|goals?|accounts?))$/i.test(v);
}
function parseNaturalAmount(text, freqHint=""){
 const raw=String(text??"").trim();
 if(!raw)return NaN;
 const f=(freqHint||"").toLowerCase();
 const patterns=[];
 if(f.includes("month")) patterns.push(/(?:\$\s*)?([0-9]+(?:,[0-9]{3})*(?:\.\d{1,2})?)\s*(?:dollars?)?\s*(?:per|a|each|every)?\s*month/i);
 if(f.includes("week")) patterns.push(/(?:\$\s*)?([0-9]+(?:,[0-9]{3})*(?:\.\d{1,2})?)\s*(?:dollars?)?\s*(?:per|a|each|every)?\s*week/i);
 if(f.includes("year")) patterns.push(/(?:\$\s*)?([0-9]+(?:,[0-9]{3})*(?:\.\d{1,2})?)\s*(?:dollars?)?\s*(?:per|a|each|every)?\s*year/i);
 if(f.includes("2 week")||f.includes("every 2")) patterns.unshift(/(?:\$\s*)?([0-9]+(?:,[0-9]{3})*(?:\.\d{1,2})?)\s*(?:dollars?)?\s*(?:every\s*2|per\s*2)\s*weeks?/i);
 for(const re of patterns){const m=raw.match(re);if(m)return parseMoney(m[1]);}
 const nums=[...raw.matchAll(/(?:\$\s*)?([0-9]+(?:,[0-9]{3})*(?:\.\d{1,2})?)/g)].map(m=>parseMoney(m[1]));
 return nums.length?nums[nums.length-1]:NaN;
}
function normalizeNaturalDate(text){
 const raw=String(text??"").trim().toLowerCase();
 if(!raw)return "";
 let m=raw.match(/(?:by|before|through|end(?:\s+of)?)\s+(?:the\s+)?end\s+of\s+(20\d{2})/i);
 if(m)return `${m[1]}-12-31`;
 m=raw.match(/\b(20\d{2})\b/); if(m && /end|by|before|deadline|due/.test(raw))return `${m[1]}-12-31`;
 return "";
}
function parseRows(text,kind){
 if(naturalNoItems(text))return [];
 return text.split(/\n+/).map(x=>x.trim()).filter(Boolean).map(line=>{
   const p=line.split("|").map(x=>x.trim());
   if(p.length>1){
     if(kind==="bills")return {name:p[0]||"Unnamed bill",amount:p[1]===""||p[1]==null?NaN:parseMoney(p[1]),freq:p[2]||"unknown",due:p[3]||""};
     if(kind==="nonMonthly")return {name:p[0]||"Unnamed expense",amount:p[1]===""||p[1]==null?NaN:parseMoney(p[1]),freq:p[2]||"unknown"};
     if(kind==="spending")return {name:p[0]||"Unnamed spending",amount:p[1]===""||p[1]==null?NaN:parseMoney(p[1]),freq:p[2]||"unknown"};
     if(kind==="debts")return {name:p[0]||"Unnamed debt",balance:p[1]===""||p[1]==null?NaN:parseMoney(p[1]),min:p[2]===""||p[2]==null?"":parseMoney(p[2]),freq:p[3]||"monthly",due:p[4]||"",rate:p[5]||""};
     if(kind==="savings")return {name:p[0]||"Unnamed goal",target:p[1]===""||p[1]==null?NaN:parseMoney(p[1]),date:p[2]||"",saved:p[3]===""||p[3]==null?0:parseSavedAmount(p[3])};
   }
   if(kind==="bills"){
     const freq=(/(?:every\s*2|every\s*two)\s*weeks?|bi-?weekly/i.test(line)?"every 2 weeks":/weekly|per week|a week|each week/i.test(line)?"weekly":/twice\s*(?:a|per)\s*month|two times a month/i.test(line)?"twice a month":/monthly|per month|a month|each month/i.test(line)?"monthly":/yearly|annual|per year|a year/i.test(line)?"yearly":"unknown");
     const amount=parseNaturalAmount(line,freq);
     const name=line.replace(/(?:\$\s*)?[0-9]+(?:,[0-9]{3})*(?:\.\d{1,2})?\s*(?:dollars?)?/gi,"").replace(/\b(?:once|twice|three times|every\s*2|every|per|a|each)\b.*$/i,"").replace(/[-–—]+\s*$/," ").trim();
     const dueMatch=line.match(/\b(?:due|on the)\s*(?:day\s*)?(\d{1,2})\b/i);
     return {name:name||"Unnamed bill",amount,freq,due:dueMatch?dueMatch[1]:""};
   }
   if(kind==="nonMonthly"){
     const freq=/(?:every\s*2|every\s*two)\s*weeks?|bi-?weekly/i.test(line)?"every 2 weeks":/weekly|per week|a week/i.test(line)?"weekly":/monthly|per month|a month/i.test(line)?"monthly":/yearly|annual|per year|a year/i.test(line)?"yearly":/as needed|when needed|occasionally/i.test(line)?"as needed":"unknown";
     return {name:line.replace(/(?:\$\s*)?[0-9]+(?:,[0-9]{3})*(?:\.\d{1,2})?\s*(?:dollars?)?/gi,"").trim()||"Unnamed expense",amount:parseNaturalAmount(line,freq),freq};
   }
   if(kind==="spending"){
     const freq=/(?:every\s*2|every\s*two)\s*weeks?|bi-?weekly/i.test(line)?"every 2 weeks":/weekly|per week|a week|each week/i.test(line)?"weekly":/twice\s*(?:a|per)\s*month|two times a month/i.test(line)?"twice a month":/monthly|per month|a month|each month/i.test(line)?"monthly":/yearly|annual|per year|a year/i.test(line)?"yearly":"unknown";
     const amount=parseNaturalAmount(line,freq);
     const name=line.replace(/(?:\$\s*)?[0-9]+(?:,[0-9]{3})*(?:\.\d{1,2})?\s*(?:dollars?)?/gi,"").replace(/\b(?:every\s*2|every|per|a|each)\s+(?:\d+\s*)?weeks?|\b(?:weekly|monthly|yearly|per\s+month|per\s+week)\b/gi,"").replace(/\|/g,"").trim();
     return {name:name||"Unnamed spending",amount,freq};
   }
   if(kind==="debts")return {name:line,balance:NaN,min:"",freq:"monthly",due:"",rate:""};
   if(kind==="savings"){
     const targetMatch=line.match(/(?:target|save|saving|for|of)\s*(?:is|:)?\s*(?:\$\s*)?([0-9]+(?:,[0-9]{3})*(?:\.\d{1,2})?)/i) || line.match(/(?:\$\s*)?([0-9]+(?:,[0-9]{3})*(?:\.\d{1,2})?)\s*(?:dollars?)?/i);
     const target=targetMatch?parseMoney(targetMatch[1]):NaN;
     const date=normalizeNaturalDate(line);
     const name=line.replace(/(?:i\s+want\s+(?:an?\s+)?|i\s+(?:want|need)\s+to\s+save\s+(?:for\s+)?|save\s+for\s+)/i,"").replace(/(?:target|by|before|through|end(?:\s+of)?).*/i,"").replace(/(?:\$\s*)?[0-9]+(?:,[0-9]{3})*(?:\.\d{1,2})?\s*(?:dollars?)?/gi,"").replace(/\b(?:savings?|saved|save|fund|goal)\b/gi," ").replace(/\s+/g," ").trim();
     return {name:name||"Unnamed goal",target,date,saved:0};
   }
 }).filter(Boolean)
}
function naturalLanguageIntegrityTest(){
 const cases=[];
 const check=(label,kind,text,expect)=>{try{const r=parseRows(text,kind);cases.push({label,pass:!!expect(r),detail:JSON.stringify(r)});}catch(e){cases.push({label,pass:false,detail:e.message})}};
 check("Bill uses the bill amount, not a referenced income amount","bills","phone usually paid once when 114 income comes in - 20 monthly",r=>r.length===1&&r[0].amount===20&&r[0].freq==="monthly");
 check("Weekly spending extracts its own amount","spending","eating out 40 a week",r=>r.length===1&&r[0].amount===40&&r[0].freq==="weekly");
 check("Every-two-weeks spending accepts the word two","spending","dispo is 40 dollars every two weeks",r=>r.length===1&&r[0].amount===40&&r[0].freq==="every 2 weeks");
 try{const base=JSON.parse(JSON.stringify(S));S.incomeAmount="114";S.incomeFreq="irregular";S.incomeNotes="I get paid 114 one check and then 2 weeks later I get 74. I also get allowance of 17 dollars but 30% of that goes to HYSA.";const actual=incomeMonthly();Object.assign(S,base);cases.push({label:"Irregular income notes can produce a recurring planning figure",pass:Number.isFinite(actual)&&Math.abs(actual-255.2333333333)<0.01,detail:`${JSON.stringify(parseIncomeNotes("I get paid 114 one check and then 2 weeks later I get 74. I also get allowance of 17 dollars but 30% of that goes to HYSA."))} => ${actual}`});}catch(e){cases.push({label:"Irregular income notes can produce a recurring planning figure",pass:false,detail:e.message})}

 check("Every-two-weeks spending preserves cadence","spending","dispo money 40 dollars every two weeks",r=>r.length===1&&r[0].amount===40&&r[0].freq==="every 2 weeks");
 check("Natural savings goal extracts target and year-end date","savings","I want an emergency savings 500 by the end of 2026",r=>r.length===1&&r[0].target===500&&r[0].date==="2026-12-31"&&r[0].saved===0);
 return cases;
}
function incomeRegressionCheck(){
 const base=JSON.parse(JSON.stringify(S));
 S.incomeAmount="114";S.incomeFreq="irregular";
 S.incomeNotes="My paychecks are irregular. I get paid 114 one check and then 2 weeks later I get 74. I also get allowance of 17 dollars but 30% of that goes to HYSA.";
 const inc=incomeMonthly();
 Object.assign(S,base);
 return {pass:Number.isFinite(inc)&&Math.abs(inc-255.2333333333)<0.01,expected:255.2333333333,actual:inc};
}

function naturalLanguageIntegrityPanel(){
 const r=naturalLanguageIntegrityTest(),passed=r.filter(x=>x.pass).length;
 const ir=incomeRegressionCheck();
 return `<div class="section"><h3>Natural-Language Integrity Test</h3><p>Plain-language financial answers must not confuse a referenced number with the actual amount being entered.</p>${r.map(x=>`<div class="review"><b>${x.pass?"PASS":"FAIL"}</b> · ${esc(x.label)}<br><span class="mini">${esc(x.detail)}</span></div>`).join("")}<div class="review"><b>${ir.pass?"PASS":"FAIL"}</b> · Irregular income monthly-equivalent calculation (${ir.pass?money(ir.actual):"unexpected"}; expected about ${money(ir.expected)})</div><div class="note"><b>${passed+(ir.pass?1:0)}/${r.length+1} natural-language/income tests passed.</b> Ambiguous information should still be confirmed rather than guessed.</div></div>`;
}

function annualize(amount,freq){
 const a=parseMoney(amount);
 if(!Number.isFinite(a)||a<0)return null;
 const f=(freq||"").toLowerCase();
 if(f.includes("2 week")||f.includes("every 2")||f.includes("biweekly")||f.includes("bi-weekly"))return a*26;
 if(f.includes("weekly"))return a*52;
 if(f.includes("twice")||f.includes("semi"))return a*24;
 if(f.includes("monthly"))return a*12;
 if(f.includes("year"))return a;
 return null;
}
function monthlyAmount(amount,freq){const a=annualize(amount,freq);return a==null?null:a/12}
function parseDate(v){
 const raw=String(v??"").trim();
 if(!/^\d{4}-\d{2}-\d{2}$/.test(raw))return null;
 const [y,m,dn]=raw.split("-").map(Number);
 const d=new Date(y,m-1,dn,12,0,0);
 if(d.getFullYear()!==y||d.getMonth()!==m-1||d.getDate()!==dn)return null;
 return d;
}
function parseUpcoming(value){
 if(!value)return [];
 if(Array.isArray(value))return value;
 if(naturalNoItems(value))return [];
 return String(value).split(/\n+/).map(x=>x.trim()).filter(Boolean).map(line=>{
   const p=line.split("|").map(x=>x.trim());
   if(p.length>=3){
     const amount=p[1]===""?null:parseMoney(p[1]);
     const date=parseDate(p[2]);
     return {description:p[0]||"Upcoming commitment",amount:Number.isFinite(amount)?amount:null,date:date?date.toISOString().slice(0,10):p[2]||""};
   }
   return {description:line,amount:null,date:""};
 });
}
function upcomingCommitments(){
 return (Array.isArray(S.upcoming)?S.upcoming:parseUpcoming(S.upcoming)).map(u=>{
   if(typeof u==="string")return {description:u,amount:null,date:""};
   return {description:String(u.description||u.name||"Upcoming commitment"),amount:Number.isFinite(parseMoney(u.amount))?parseMoney(u.amount):null,date:String(u.date||"")};
 });
}
function upcomingRiskSummary(){
 const today=new Date(); today.setHours(12,0,0,0);
 const end=new Date(today); end.setDate(end.getDate()+90);
 const items=upcomingCommitments().filter(u=>{const d=parseDate(u.date);return d&&d>=today&&d<=end&&u.amount!=null;});
 const total=items.reduce((a,u)=>a+u.amount,0);
 const room=typeof snapshot==="function"?snapshot().remaining:null;
 return {items,total,room,warn:room!=null&&total>Math.max(room,0)};
}
function monthsBetween(from,to){
 if(!from||!to)return null;
 const a=parseDate(from),b=parseDate(to);
 if(!a||!b||b<=a)return null;
 return Math.max((b-a)/(1000*60*60*24*30.4375),0.25);
}
function runtimeSource(){
 try{
  const html=document.documentElement.outerHTML;
  const script=[...document.scripts].map(x=>x.textContent||"").join("\n");
  return {html,script};
 }catch(e){return {html:"",script:""};}
}
function releaseSecurityIntegrityTest(){
 const cases=[];
 const src=runtimeSource(), script=src.script, html=src.html;

 cases.push({
   label:"Saved-state JSON parsing is protected",
   pass:/try\s*\{\s*SAVED\s*=\s*JSON\.parse/.test(script)
 });
 cases.push({
   label:"Planning language does not equate planning room with bank balance",
   pass:(()=>{try{const output=[dashboardPreview(),binderPreview(),actionPlan()].join(" ");return /not a bank balance/i.test(output)}catch(e){return false}})()
 });
 cases.push({
   label:"Transfer handling has explicit pending treatment",
   pass:/pending/i.test(script) && /transfer/i.test(script)
 });
 cases.push({
   label:"Customer credentials are not requested by the intake fields",
   pass:!/<input[^>]+type=["']password["']/i.test(script) && !/<input[^>]+name=["'][^"']*account[^"']*number[^"']*["']/i.test(script)
 });
 cases.push({
   label:"No external network fetch is required for the standalone beta",
   pass:!new RegExp("\\b"+"fetch"+"\\s*\\(").test(script) && !new RegExp("new\\s+"+"XMLHttpRequest"+"\\s*\\(").test(script)

function allocationEngine(){

 }).filter(g=>g.remaining>0);

   const monthly=Number.isFinite(amount)?monthlyAmount(amount,n.freq):null;
   return {name:n.name||"Unnamed expense",amount,monthly,freq:n.freq||"unknown"};
 });
 const normalizedNonMonthly=nonMonthly.reduce((sum,n)=>sum+(n.monthly==null?0:n.monthly),0);
 const warnings=[];
 if(monthlyRoom==null)warnings.push("There is not enough confirmed recurring information to allocate monthly planning room.");
 if(S.reserve!==""&&S.reserve!=null&&Number.isFinite(parseReserveAmount(S.reserve))&&parseReserveAmount(S.reserve)>0)warnings.push("Protected reserve: reserve money is not treated as new income or automatically made available for goals or everyday spending.");
 if(nonMonthly.some(n=>n.monthly==null))warnings.push("At least one non-monthly expense has a frequency that cannot safely be normalized. Protect its actual timing separately.");
 if(goalRows.length>1)warnings.push("Goals compete for the same available dollars. Money Reset will not fund every goal simultaneously unless the math supports it.");
 const unknownNonMonthly=nonMonthly.some(n=>n.monthly==null);
 let pool=(monthlyRoom==null||unknownNonMonthly)?null:Math.max(monthlyRoom-normalizedNonMonthly,0);
 const ranked=[...goalRows].sort((a,b)=>({high:0,standard:1,low:2}[a.priority]??1)-({high:0,standard:1,low:2}[b.priority]??1));
 const allocations=[];
 if(pool!=null)ranked.forEach(g=>{const suggested=Math.min(g.remaining,pool);allocations.push({name:g.name,remaining:g.remaining,suggested});pool-=suggested;});
 const totalAllocated=allocations.reduce((sum,x)=>sum+x.suggested,0);
 return {monthlyRoom,normalizedNonMonthly,allocations,totalAllocated,unallocated:pool,warnings};
}

function totalMonthlyBills(){return (S.bills||[]).reduce((a,x)=>{const m=x&&monthlyAmount(x.amount,x.freq);return a+(Number.isFinite(m)?m:0)},0)}

function parseIncomeNotes(text){
 const raw=String(text??"").trim();
 if(!raw)return [];
 const sources=[];
 const moneyRe='(?:\\$\\s*)?([0-9]+(?:,[0-9]{3})*(?:\\.[0-9]{1,2})?)';
 // Alternating paychecks: e.g. "I get paid 114 one check and then 2 weeks later I get 74."
 let m=raw.match(new RegExp('get\\s+paid\\s+'+moneyRe+'[^.\\n]*?(?:2|two)\\s+weeks?\\s+later[^.\\n]*?(?:get\\s+paid\\s+|then\\s+)?'+moneyRe,'i'));
 if(m){
   const a=parseMoney(m[1]), b=parseMoney(m[2]);
   if(Number.isFinite(a)&&Number.isFinite(b)&&a>=0&&b>=0){
     sources.push({name:"Alternating paycheck A",amount:a,freq:"every 2 weeks",pattern:"alternating"});
     sources.push({name:"Alternating paycheck B",amount:b,freq:"every 2 weeks",pattern:"alternating"});
   }
 }
 // Weekly allowance, including a stated percentage sent to savings/retirement.
 m=raw.match(new RegExp('allowance\\s+(?:of\\s+)?'+moneyRe+'\\s*(?:dollars?)?','i'));
 if(m){
   const gross=parseMoney(m[1]);
   const pctMatch=raw.match(/allowance[^.\n]*?([0-9]+(?:\.[0-9]+)?)\s*%[^.\n]*?(?:deduct|goes|sent|put|contribut)/i);
   const pct=Number.isFinite(parseFloat(pctMatch&&pctMatch[1]))?parseFloat(pctMatch[1]):0;
   if(Number.isFinite(gross)&&gross>=0){
     const net=gross*(1-Math.min(Math.max(pct,0),100)/100);
     sources.push({name:"Allowance",amount:net,freq:"weekly",gross,pctToSavings:pct});
   }
 }
 return sources;
}
function incomeMonthly(){
 const a=parseMoney(S.incomeAmount),f=(S.incomeFreq||"").toLowerCase();
 if(/irregular|multiple/.test(f)){
   const sources=parseIncomeNotes(incomeText());
   if(!sources.length)return null;
   let total=0;
   const alt=sources.filter(x=>x.pattern==="alternating");
   if(alt.length===2){
     // Two alternating checks are one biweekly sequence, not two biweekly incomes.
     // Across a year, each check occurs 13 times.
     total += ((alt[0].amount+alt[1].amount)*13)/12;
   }else if(alt.length===1){
     total += monthlyAmount(alt[0].amount,"every 4 weeks") || 0;
   }
   sources.filter(x=>x.pattern!=="alternating").forEach(x=>{
     const m=monthlyAmount(x.amount,x.freq);
     if(Number.isFinite(m))total+=m;
   });
   return Number.isFinite(total)?total:null;
 }
 return monthlyAmount(a,f)
}

function cashFlowTimeline(days=30){
 const start=new Date(); start.setHours(12,0,0,0);
 const end=new Date(start); end.setDate(end.getDate()+Math.max(1,Number(days)||30));
 const events=[];
 const add=(date,label,amount,type)=>{if(date&&date>=start&&date<=end&&Number.isFinite(+amount))events.push({date:new Date(date),label,amount:+amount,type})};
 if(S.nextPay&&Number.isFinite(parseMoney(S.incomeAmount))&&parseMoney(S.incomeAmount)>0){
   const incomeAmount=parseMoney(S.incomeAmount);
   let d=parseDate(S.nextPay);
   if(d){
     const f=(S.incomeFreq||'').toLowerCase();
     if(d>=start)add(d,'Income',incomeAmount,'in');
     else if(f.includes('2 week')||f.includes('every 2')||f.includes('biweekly')||f.includes('bi-weekly')||f.includes('weekly')){
       const step=(f.includes('2 week')||f.includes('every 2')||f.includes('biweekly')||f.includes('bi-weekly'))?14:7;
       while(d<start)d.setDate(d.getDate()+step);
       for(;d<=end;d.setDate(d.getDate()+step))add(d,'Income',incomeAmount,'in');
     }
   }
 }
 (S.bills||[]).forEach(b=>{
   const day=parseInt(b.due,10), f=(b?.freq||'').toLowerCase();
   if(b&&typeof b==='object'&&day>=1&&day<=31&&Number.isFinite(parseMoney(b.amount))&&f.includes('monthly')){
     let y=start.getFullYear(),m=start.getMonth();
     for(let i=0;i<3;i++){
       const last=new Date(y,m+1,0,12).getDate();
       const d=new Date(y,m,Math.min(day,last),12);
       if(d>=start&&d<=end)add(d,b.name,parseMoney(b.amount),'out');
       m++; if(m>11){m=0;y++;}
     }
   }
 });
 (S.debts||[]).forEach(dbt=>{
   const day=parseInt(dbt?.due,10), f=(dbt?.freq||'').toLowerCase();
   if(dbt&&day>=1&&day<=31&&Number.isFinite(parseMoney(dbt.min))&&f.includes('monthly')){
     let y=start.getFullYear(),m=start.getMonth();
     for(let i=0;i<3;i++){
       const last=new Date(y,m+1,0,12).getDate();
       const d=new Date(y,m,Math.min(day,last),12);
       if(d>=start&&d<=end)add(d,`${dbt.name||'Debt'} minimum`,parseMoney(dbt.min),'out');
       m++; if(m>11){m=0;y++;}
     }
   }
 });
 upcomingCommitments().forEach(u=>{
   const d=parseDate(u.date);
   if(d&&u.amount!=null)add(d,u.description,u.amount,'upcoming');
 });
 events.sort((a,b)=>a.date-b.date);
 let net=0;events.forEach(e=>{net+=e.type==='in'?e.amount:-e.amount;e.net=net});
 return {start,end,events,net};
}

function cashFlowTimingSafety(days=30){
 const t=cashFlowTimeline(days), firstIncome=t.events.find(e=>e.type==='in');
 const preIncome=t.events.filter(e=>e.type!=='in' && (!firstIncome || e.date<=firstIncome.date));
 const preIncomeOut=preIncome.reduce((a,e)=>a+e.amount,0);
 const sameDay=t.events.filter(e=>firstIncome&&e.date.getTime()===firstIncome.date.getTime()&&e.type!=='in');
 const issues=[];
 if(firstIncome&&preIncomeOut>0)issues.push(`At least ${money(preIncomeOut)} of dated commitments appear on or before the next confirmed income event. Starting balances or another confirmed funding source are needed; Money Reset will not assume those dollars are available.`);
 if(sameDay.length)issues.push(`A same-day income/commitment timing point exists. Money Reset does not assume which transaction posts first.`);
 const undatedNonMonthly=(S.bills||[]).some(b=>b&&b.freq&&!String(b.freq).toLowerCase().includes('monthly')&&(!parseInt(b.due,10)||parseInt(b.due,10)<1||parseInt(b.due,10)>31));
 if(undatedNonMonthly)issues.push('At least one non-monthly regular bill does not have a usable due day, so its exact cash-flow timing remains unknown.');
 return {issues,preIncomeOut};
}

function versionSnapshot(label){
 if(window.MR_QA_MODE)return true;
 try{
  const snap=cleanRecord();
  let history=[];
  try{const raw=localStorage.getItem("moneyResetHistory");history=raw?JSON.parse(raw):[]}catch(e){history=[]}
  if(!Array.isArray(history))history=[];
  history.unshift({label:String(label||"Plan version"),time:new Date().toLocaleString(),data:snap});
  localStorage.setItem("moneyResetHistory",JSON.stringify(history.slice(0,10)));
  return true;
 }catch(e){return false}
}

 const nextValue=type==="Income"?String(amt):amt;

 render();

function timingChecks(){
 const issues=[];
 const today=new Date(); today.setHours(12,0,0,0);
 if(S.nextPay){
   const p=parseDate(S.nextPay);
   if(!p)issues.push("Next pay date could not be read.");
   else if(p<today)issues.push("Next pay date is in the past; confirm the next actual pay date.");
 }
 (S.bills||[]).forEach(b=>{
   if(!b||typeof b!=="object"){issues.push("A bill entry is malformed and needs review.");return;}
   if(b.due!=="" && (!/^\d{1,2}$/.test(String(b.due)) || +b.due<1 || +b.due>31))
     issues.push(`Bill "${b.name}" has an invalid due day.`);
 });
 (S.savings||[]).forEach(g=>{
   if(!g||typeof g!=="object"){issues.push("A savings goal entry is malformed and needs review.");return;}
   if(g.date && !parseDate(g.date))issues.push(`Savings goal "${g.name}" has an invalid target date.`);
 });
 return [...new Set(issues)];
}

function incomeCalendarEvents(today){
 const events=[];
 const f=(S.incomeFreq||"").toLowerCase();
 if(S.nextPay){
   const anchor=parseDate(S.nextPay);
   if(anchor){
     if(/irregular|multiple/.test(f)){
       const sources=parseIncomeNotes(incomeText());
       const payA=sources.find(x=>x.pattern==="alternating"&&x.name.includes("A"));
       const payB=sources.find(x=>x.pattern==="alternating"&&x.name.includes("B"));
       if(payA&&payB){
         for(let i=0;i<12;i++){
           const d=new Date(anchor); d.setDate(d.getDate()+14*i);
           const src=(i%2===0)?payA:payB;
           events.push({date:d,label:i%2===0?"Paycheck A · alternating":"Paycheck B · alternating",amount:src.amount,type:"in"});
         }
       }else if(payA){
         for(let i=0;i<6;i++){
           const d=new Date(anchor); d.setDate(d.getDate()+28*i);
           events.push({date:d,label:"Paycheck A",amount:payA.amount,type:"in"});
         }
       }
       const allowance=sources.find(x=>x.name==="Allowance");
       const noteDate=String(S.anything||"").match(/(?:start|get|getting)\s+(?:getting\s+)?(?:that\s+)?(?:allowance\s+)?(?:on\s+)?(?:sept(?:ember)?\.?\s*\d{1,2}|\d{1,2}\/?\d{1,2})/i);
       let adate=null;
       const md=String(S.anything||"").match(/(?:sept(?:ember)?\.?\s*)(\d{1,2})/i);
       if(md){adate=new Date(anchor.getFullYear(),8,Number(md[1]),12)}
       if(allowance){
         if(!adate||adate<today)adate=new Date(today);
         adate.setHours(12,0,0,0);

function reconcile(){
 const issues=[], x=snapshot();
 const reserveAmount=parseReserveAmount(S.reserve);
 if(S.reserve!==""&&S.reserve!=null&&(!Number.isFinite(reserveAmount)||reserveAmount<0))issues.push("Reserve must be a valid amount of $0 or more; confirm the amount entered.");
 S.bills.forEach(b=>{if(!b||typeof b!=="object"){issues.push("A bill entry is malformed and needs review.");return;} const amount=parseMoney(b.amount); if(!Number.isFinite(amount)||amount<0)issues.push(`Bill "${b.name||"Unnamed bill"}" has an invalid amount.`); if(!b.freq||b.freq==="unknown")issues.push(`Bill "${b.name||"Unnamed bill"}" needs a frequency.`)});
 S.spending.forEach(v=>{if(!v||typeof v!=="object"){issues.push("A spending entry is malformed and needs review.");return;} const amount=parseMoney(v.amount); if(!Number.isFinite(amount)||amount<0)issues.push(`Spending "${v.name||"Unnamed spending"}" has an invalid amount.`); if(monthlyAmount(amount,v.freq)==null)issues.push(`Spending "${v.name||"Unnamed spending"}" has a frequency that cannot yet be normalized.`)});
 S.debts.forEach(d=>{if(!d||typeof d!=="object"){issues.push("A debt entry is malformed and needs review.");return;} const bal=parseMoney(d.balance), min=parseMoney(d.min); if(!Number.isFinite(bal)||bal<0)issues.push(`Debt "${d.name||"Unnamed debt"}" has an invalid balance.`); if(d.min!==""&&d.min!=null&&(!Number.isFinite(min)||min<0))issues.push(`Debt "${d.name||"Unnamed debt"}" has an invalid minimum payment.`); if(d.min!==""&&d.min!=null&&monthlyAmount(min,d.freq)==null)issues.push(`Debt "${d.name||"Unnamed debt"}" has a payment frequency that cannot yet be normalized.`)});
 const unknownFreq=[...(S.bills||[]),...(S.spending||[]),...(S.debts||[]).filter(d=>d&&d.min!==""&&d.min!=null)].filter(v=>!v || monthlyAmount(v.amount??v.min,v.freq)==null).length;
 issues.push(...timingChecks());
 S.nonMonthly.forEach(n=>{
   if(!n||typeof n!=="object"){issues.push("A non-monthly expense entry is malformed and needs review.");return;}
   const amount=parseMoney(n.amount); if(!Number.isFinite(amount)||amount<0)issues.push(`Non-monthly expense "${n.name||"Unnamed expense"}" has an invalid amount.`);
   if(!n.freq||n.freq==="unknown")issues.push(`Non-monthly expense "${n.name||"Unnamed expense"}" needs a frequency or timing description.`);
 });
 S.savings.forEach(g=>{if(!g||typeof g!=="object"){issues.push("A savings goal entry is malformed and needs review.");return;} const target=parseMoney(g.target),saved=parseMoney(g.saved); if(!Number.isFinite(target)||target<0||!Number.isFinite(saved)||saved<0)issues.push(`Savings goal "${g.name||"Unnamed goal"}" has an invalid amount.`); else if(saved>target)issues.push(`Savings goal "${g.name||"Unnamed goal"}" has more saved than its target.`);});
 const seenBills=new Set();
 (S.bills||[]).forEach(b=>{
   if(!b||typeof b!=="object") return;
   const key=[String(b.name||"").trim().toLowerCase(),Number(b.amount)||0,
              String(b.freq||"").trim().toLowerCase(),String(b.due||"").trim()].join("|");
   if(key!=="|||"){
     if(seenBills.has(key)) issues.push("An exact duplicate bill entry was detected; review it before finalizing.");
     seenBills.add(key);
   }
 });

 return {issues:[...new Set(issues)],unknownFreq,monthlyIncome:x.inc,monthlyOutflow:x.out,remaining:x.remaining};
}

function normalizeImportedRecord(incoming){
 const allowed=["step","goals","incomeFreq","incomeAmount","nextPay","accounts","bills","nonMonthly","spending","debts","debtPref","savings","reserve","upcoming","stress","anything","incomeNotes","approved","transfers"];
 const out={};
 allowed.forEach(k=>{if(Object.prototype.hasOwnProperty.call(incoming,k))out[k]=incoming[k];});
 const arrays=["goals","accounts","bills","nonMonthly","spending","debts","savings","upcoming","transfers"];
 arrays.forEach(k=>{
   if(!Array.isArray(out[k]))out[k]=[];
   if(k==="goals"||k==="accounts") out[k]=out[k].filter(v=>typeof v==="string").map(v=>v.slice(0,200));
   else if(k==="upcoming") out[k]=out[k].filter(v=>(typeof v==="string")||(v&&typeof v==="object"&&!Array.isArray(v))).map(v=>{if(typeof v==="string")return {description:v.slice(0,2000),amount:null,date:""};return {description:String(v.description||v.name||"Upcoming commitment").slice(0,500),amount:Number.isFinite(v.amount)?v.amount:null,date:String(v.date||"").slice(0,20)}});
   else out[k]=out[k].filter(v=>v&&typeof v==="object"&&!Array.isArray(v)).map(v=>{
     const q={}; Object.keys(v).slice(0,12).forEach(key=>{
       const val=v[key];
       if(typeof val==="string")q[key]=val.slice(0,500);
       else if(typeof val==="number"&&Number.isFinite(val))q[key]=val;
     });
     return q;
   });
 });
 if(typeof out.step!=="number" || !Number.isFinite(out.step))out.step=1;
 out.step=Math.max(0,Math.min(MAX_BETA_STEP,Math.floor(out.step)));
 if(typeof out.incomeFreq!=="string")out.incomeFreq="";
 if(typeof out.incomeAmount!=="number" && typeof out.incomeAmount!=="string")out.incomeAmount="";
 if(typeof out.nextPay!=="string")out.nextPay="";
 if(typeof out.debtPref!=="string")out.debtPref="";
 if(typeof out.reserve!=="number" && typeof out.reserve!=="string")out.reserve="";
 if(typeof out.stress!=="string")out.stress="";
 if(typeof out.anything!=="string")out.anything="";
 if(typeof out.incomeNotes!=="string")out.incomeNotes="";
 out.approved=false;
 return out;
}
function customerImport(){
 const raw=prompt("Paste your Money Reset record JSON:");
 if(!raw)return;
 try{
   const parsed=JSON.parse(raw);
   const incoming=parsed&&parsed.data?parsed.data:parsed;
   if(!incoming||typeof incoming!=="object"||Array.isArray(incoming))throw new Error("Invalid record");
   const normalized=normalizeImportedRecord(incoming);
   const before=JSON.parse(JSON.stringify(cleanRecord()));
   Object.keys(normalized).forEach(k=>{S[k]=normalized[k];});
   S.approved=false;
   if(!persistBeta()){
     Object.keys(before).forEach(k=>{S[k]=before[k];});
     S.approved=false;
     render();
     throw new Error("Could not save restored record");

 }catch(e){alert("That record could not be restored. Your previous saved record was not replaced.");}
}
