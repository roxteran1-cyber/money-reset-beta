name: Run income parser patch safely
on:
  push:
    paths:
      - '.github/workflows/apply-income-parser-fix2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch parser
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          a=s.index('function parseIncomeNotes(text){')
          b=s.index('\nfunction incomeMonthly(){',a)
          new=r'''function parseIncomeNotes(text){
 const raw=String(text??"").trim(); if(!raw)return [];
 const sources=[];
 const moneyRe='(?:\\$\\s*)?([0-9]+(?:,[0-9]{3})*(?:\\.[0-9]{1,2})?)';
 const add=(name,amount,freq,extra={})=>{if(Number.isFinite(amount)&&amount>=0)sources.push({name,amount,freq,pattern:"recurring",...extra});};
 let m=raw.match(new RegExp('get\\s+paid\\s+'+moneyRe+'[^.\\n]*?(?:2|two)\\s+weeks?\\s+later[^.\\n]*?(?:get\\s+paid\\s+|then\\s+)?'+moneyRe,'i'));
 if(m){const a=parseMoney(m[1]),b2=parseMoney(m[2]);if(Number.isFinite(a)&&Number.isFinite(b2)){sources.push({name:"Alternating paycheck A",amount:a,freq:"every 2 weeks",pattern:"alternating"});sources.push({name:"Alternating paycheck B",amount:b2,freq:"every 2 weeks",pattern:"alternating"});}}
 m=raw.match(new RegExp('allowance\\s+(?:of\\s+)?'+moneyRe+'\\s*(?:dollars?)?','i'));
 if(m){const gross=parseMoney(m[1]);const pm=raw.match(/allowance[^.\n]*?([0-9]+(?:\.[0-9]+)?)\s*%[^.\n]*?(?:deduct|goes|sent|put|contribut)/i);const pct=pm?parseFloat(pm[1]):0;if(Number.isFinite(gross)){const net=gross*(1-Math.min(Math.max(pct,0),100)/100);sources.push({name:"Allowance",amount:net,freq:"weekly",gross,pctToSavings:pct,pattern:"recurring"});}}
 const defs=[
  ["every 2 weeks",/(?:every\s*(?:2|two)|bi-?weekly)\s+weeks?/i],
  ["twice a month",/(?:twice\s+(?:a|per)\s+month|two\s+times\s+(?:a|per)\s+month)/i],
  ["weekly",/(?:weekly|every\s+week|per\s+week|a\s+week|each\s+week)/i],
  ["monthly",/(?:monthly|every\s+month|per\s+month|a\s+month|each\s+month)/i],
  ["yearly",/(?:yearly|annual(?:ly)?|every\s+year|per\s+year|a\s+year|each\s+year)/i]
 ];
 raw.split(/[.!?\n]+/).map(x=>x.trim()).filter(Boolean).forEach(clause=>{
  if(/\ballowance\b/i.test(clause))return;
  if(/\b(?:I\s+pay|paid\s+to|owe|owes|payment\s+for|child\s+support\s+(?:paid|payment)|rent|bill)\b/i.test(clause))return;
  for(const [freq,fr] of defs){
   if(freq==="monthly"&&/(?:twice\s+(?:a|per)\s+month|two\s+times\s+(?:a|per)\s+month)/i.test(clause))continue;
   const re=new RegExp(moneyRe+'\\s*(?:dollars?)?\\s*(?:[^0-9$]{0,60}?)'+fr.source,'gi');
   let x; while((x=re.exec(clause))){const amount=parseMoney(x[1]);if(!Number.isFinite(amount))continue;let name=clause.slice(0,x.index).replace(/^.*?\b(?:get paid|gets paid|receive|receives|earn|earns|income|salary|wage|from)\b/i,'').trim();name=name.replace(new RegExp(moneyRe+'\\s*(?:dollars?)?\\s*$','i'),'').trim()||"Income source";add(name,amount,freq);}
  }
 });
 const seen=new Set(),out=[]; sources.forEach(x=>{const key=[x.pattern,x.name,x.amount,x.freq,x.pctToSavings||0].join("|");if(!seen.has(key)){seen.add(key);out.push(x);}}); return out;
}'''
          p.write_text(s[:a]+new+s[b:])
          PY
      - name: Validate and commit
        run: |
          python -c "from pathlib import Path; import re; s=Path('index.html').read_text(); js=re.search(r'<script>([\\s\\S]*?)</script>',s).group(1); Path('/tmp/mr.js').write_text(js)"
          node --check /tmp/mr.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Improve multiple-income parsing'
          git push