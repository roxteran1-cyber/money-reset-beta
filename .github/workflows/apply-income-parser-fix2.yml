name: Run income parser patch safely
on:
  push:
    paths:
      - '.github/workflows/apply-income-parser-fix2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate
        env:
          PATCH_B64: 
        run: python -c "import base64,re,pathlib; p=pathlib.Path('index.html'); s=p.read_text(); a=s.index('function parseIncomeNotes(text){'); b=s.index('\\nfunction incomeMonthly(){',a); new=base64.b64decode(__import__('os').environ['PATCH_B64']).decode(); p.write_text(s[:a]+new+s[b:])"
      - name: Validate
        run: |
          python -c "from pathlib import Path; import re; s=Path('index.html').read_text(); js=re.search(r'<script>([\\s\\S]*?)</script>',s).group(1); Path('/tmp/mr.js').write_text(js)"
          node --check /tmp/mr.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Improve multiple-income parsing'
          git push